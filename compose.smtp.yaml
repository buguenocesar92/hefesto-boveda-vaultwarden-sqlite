services:
  app:
    environment:
      INVITATIONS_ALLOWED: 'true'
      SMTP_HOST: ${SMTP_HOST:?Configurar SMTP}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_FROM: ${SMTP_FROM:?Falta remitente}
      SMTP_FROM_NAME: Hefesto Boveda
      SMTP_USERNAME: ${SMTP_USERNAME:?Falta usuario}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Falta clave}
      SMTP_ACCEPT_INVALID_CERTS: 'false'
      SMTP_ACCEPT_INVALID_HOSTNAMES: 'false'
      SMTP_DEBUG: 'false'
